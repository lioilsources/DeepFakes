# Pravdoměr API on the NAS. Public access only via Cloudflare Tunnel
# (no published port); values come from .env next to this file.
services:
  pravdomer-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pravdomer
      POSTGRES_USER: pravdomer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pravdomer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravdomer"]
      interval: 10s
      retries: 5

  pravdomer-api:
    build: .
    restart: unless-stopped
    depends_on:
      pravdomer-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pravdomer:${POSTGRES_PASSWORD}@pravdomer-db:5432/pravdomer?sslmode=disable
      LLM_BASE_URL: ${LLM_BASE_URL:?set in .env}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepfake-llm}
      LISTEN_ADDR: ":8096"
    networks: [default, tunnel]

volumes:
  pravdomer-db:

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-cloudflared}
